<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>Shower Brawl Manette</title>
<link rel="stylesheet" href="./play.css">
</head>
<body>
<section id="select">
  <h1>Shower Brawl</h1>
  <input id="name" maxlength="16" placeholder="Ton pseudo (optionnel)" autocomplete="off">
  <div class="teams">
    <button class="team A" data-team="A">Équipe Bleue</button>
    <button class="team B" data-team="B">Équipe Rouge</button>
  </div>
  <div id="chars" class="chars"></div>
  <button id="join" class="join" disabled>Rejoindre</button>
  <p id="err" class="err"></p>
</section>
<section id="pad" hidden>
  <header class="hud"><span id="hp">PV --</span><span id="score"><b class="a">0</b> - <b class="b">0</b></span><span id="timer">--:--</span><button id="vib" class="vib" type="button" aria-label="Vibrations">📳</button></header>
  <div id="hit" class="hit" aria-hidden="true"></div>
  <label id="hapLbl" class="hap" aria-hidden="true"><input id="hap" type="checkbox" switch tabindex="-1"></label>
  <p id="kit-hint" class="kit-hint"></p>
  <div id="respawn" class="respawn" hidden></div>
  <div id="stick" class="stick"></div>
  <div class="btns">
    <button class="btn" data-k="super"><img alt="" hidden><span></span><i class="cd"></i><em></em></button>
    <button class="btn" data-k="defense"><img alt="" hidden><span></span><i class="cd"></i><em></em></button>
    <button class="btn big" data-k="attack"><img alt="" hidden><span></span><i class="cd"></i><em></em></button>
  </div>
</section>
<section id="end" hidden><h2 id="endTitle"></h2><p id="endScore"></p><p id="endMvp"></p><p>En attente de la prochaine manche...</p></section>
<script type="module" src="./play.js"></script>
</body>
</html>
