<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shower Brawl</title>
<style>
  :root{--navy:#0b1020;--panel:#101a31;--panel2:#162642;--blue:#2f7de1;--blueL:#60a5fa;--red:#e0413a;--redL:#f87171;--gold:#f6c343;--white:#f2efe4;--muted:#9aa7b8;--black:#08111f;
    --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
  html,body{margin:0;height:100%;background:var(--navy);color:var(--white);font-family:var(--mono);overflow:hidden}
  /* Lobby hote: design/lobby-approved.json */
  #lobbyBg{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:0}
  #lobby{position:fixed;inset:0;z-index:1;display:grid;box-sizing:border-box;padding:1.6vh 2vw;gap:1.4vh 2vw;
    grid-template-columns:1fr minmax(0,26vw) 1fr;grid-template-rows:auto 1fr auto;
    grid-template-areas:"brand brand brand" "blue join red" "roster roster roster";
    background:radial-gradient(ellipse 34vw 46vh at 50% 52%,#08111fb0,#08111f00 100%)}
  #brand{grid-area:brand;justify-self:center;display:flex;flex-direction:column;align-items:center;text-align:center;line-height:1;max-width:100%}
  #brand h1{margin:0;font:900 clamp(26px,7vh,72px)/1 var(--mono);letter-spacing:.08em;color:var(--white);
    text-shadow:3px 0 0 var(--red),-3px 0 0 var(--blue),0 4px 0 var(--black),0 0 18px #0008}
  /* Tagline: meme famille/graisse que le logo, chromatisme rouge/bleu reduit, hierarchie plus petite */
  #brand .tag{margin:1vh 0 0;padding:.6vh 1.4vw;background:#08111fc4;box-shadow:0 0 0 2px #08111f80;border-radius:2px;font:900 clamp(10px,1.85vh,18px)/1.32 var(--mono);letter-spacing:.06em;color:var(--white);
    text-transform:uppercase;text-shadow:1px 0 0 var(--red),-1px 0 0 var(--blue),0 2px 0 var(--black)}
  #brand .tag span{display:block;white-space:nowrap}
  #brand .tag span:last-child{color:var(--gold)}
  .frame{background:linear-gradient(var(--panel2),var(--panel));border:3px solid var(--black);border-radius:2px;
    box-shadow:inset 0 0 0 2px #ffffff14,0 6px 0 #0009,0 0 24px #0007}
  #join{grid-area:join;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4vh;min-height:0}
  #joinPanel{width:100%;box-sizing:border-box;padding:1.6vh 1.2vw;display:flex;flex-direction:column;align-items:center;gap:1vh}
  #joinPanel .title{font:900 clamp(12px,2.2vh,22px)/1 var(--mono);letter-spacing:.2em;color:var(--gold)}
  #qr{display:block;width:min(100%,38vh);aspect-ratio:1;background:#fff;padding:8px;box-sizing:border-box;image-rendering:pixelated;border-radius:0}
  #start{font:900 clamp(18px,4vh,40px)/1 var(--mono);letter-spacing:.1em;padding:1.8vh 2.4vw;cursor:pointer;color:var(--black);
    background:linear-gradient(#ffe07a,var(--gold) 55%,#d99a1c);border:4px solid var(--black);border-radius:2px;
    box-shadow:inset 0 3px 0 #fff6,inset 0 -4px 0 #0003,0 6px 0 var(--black),0 0 28px #f6c34366;white-space:nowrap}
  #start:hover{filter:brightness(1.08)}#start:active{transform:translateY(3px);box-shadow:inset 0 3px 0 #fff6,0 3px 0 var(--black)}
  #teams{display:contents}
  #waiting{grid-row:2;grid-column:1/-1;align-self:end;justify-self:center;margin:0 0 .6vh;font:700 clamp(10px,1.5vh,15px)/1 var(--mono);letter-spacing:.12em;color:#ffffff8c;text-shadow:0 2px 0 var(--black);pointer-events:none}
  .team{align-self:center;box-sizing:border-box;padding:1.2vh 1vw;min-width:0}
  #teamA{grid-area:blue;border-color:var(--black);box-shadow:inset 0 0 0 2px #ffffff14,inset 6px 0 0 var(--blue),0 6px 0 #0009}
  #teamB{grid-area:red;box-shadow:inset 0 0 0 2px #ffffff14,inset -6px 0 0 var(--red),0 6px 0 #0009}
  .team h2{margin:0 0 1vh;font:900 clamp(14px,min(3.4vh,2vw),34px)/1 var(--mono);letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 3px 0 var(--black)}
  #teamA h2{color:var(--blueL);padding-left:6px}#teamB h2{color:var(--redL);text-align:right;padding-right:6px}
  .team ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.8vh}
  .slot{display:flex;align-items:center;gap:1vw;height:clamp(40px,8.4vh,84px);padding:0 1vw;background:#08111fcc;border:2px solid #ffffff12}
  .slot .spr{flex:0 0 auto;width:clamp(36px,7.6vh,76px);height:100%;display:flex;align-items:flex-end;justify-content:center}
  .slot .spr img,.slot .spr canvas{max-width:100%;max-height:100%;image-rendering:pixelated}
  .slot .txt{min-width:0;display:flex;flex-direction:column;gap:.4vh}
  .slot .pn{font:900 clamp(14px,3vh,30px)/1 var(--mono);color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
  .slot .cn{font-size:clamp(10px,1.8vh,18px);letter-spacing:.1em;text-transform:uppercase}
  #teamA .slot.on{border-color:var(--blue);background:linear-gradient(90deg,#2f7de144,#08111fcc)}#teamA .cn{color:var(--blueL)}
  #teamB .slot.on{border-color:var(--red);background:linear-gradient(270deg,#e0413a44,#08111fcc)}#teamB .cn{color:var(--redL)}
  .slot{position:relative}.slot.offline{opacity:.45}
  .slot .kick{position:absolute;top:2px;right:2px;width:clamp(18px,2.6vh,26px);height:clamp(18px,2.6vh,26px);padding:0;border:1px solid #ffffff33;background:#0008;color:#fff9;font:700 clamp(12px,2vh,18px)/1 var(--mono);cursor:pointer;opacity:.35}
  .slot .kick:hover{opacity:1;color:#fff;border-color:var(--red)}#teamB .slot .kick{right:auto;left:2px}
  #teamB .slot{flex-direction:row-reverse}#teamB .slot .txt{align-items:flex-end}
  .slot.empty{color:var(--muted);border-style:dashed;font-size:clamp(10px,1.8vh,17px);letter-spacing:.12em}
  .slot.empty .plus{flex:0 0 auto;width:clamp(36px,7.6vh,76px);text-align:center;font:900 clamp(20px,4vh,40px)/1 var(--mono);color:#ffffff44}
  #roster{grid-area:roster;justify-self:center;display:grid;grid-auto-flow:column;grid-auto-columns:clamp(44px,7vw,92px);justify-content:center;align-items:end;gap:0;padding:.9vh 1vw .7vh;max-width:100%;overflow:hidden}
  #roster .r{display:flex;flex-direction:column;align-items:center;gap:.5vh;min-width:0;font-size:clamp(7px,min(1.1vh,.78vw),11px);color:var(--muted);text-transform:uppercase}
  #roster .r .spr{width:100%;height:clamp(24px,6.4vh,64px);display:flex;align-items:flex-end;justify-content:center}
  #roster .r img,#roster .r canvas{max-width:86%;max-height:100%;width:auto;height:auto;object-fit:contain;image-rendering:pixelated}
  #roster .r canvas.trim{height:100%;object-position:50% 100%}
  #roster .r span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
  .slot .spr canvas.trim{max-height:88%}
  @media (max-width:900px){#roster .r span{display:none}}
  #fps{display:none;position:fixed;left:90px;bottom:6px;z-index:6;font:10px ui-monospace,Menlo,Consolas,monospace;color:#9aa7b8b0;pointer-events:none}
  #version{display:none;position:fixed;left:8px;bottom:6px;z-index:6;font:10px ui-monospace,Menlo,Consolas,monospace;color:#9aa7b880;pointer-events:none}
  #game{position:fixed;inset:0;display:none}
  #mute{position:fixed;top:10px;left:10px;z-index:7;width:34px;height:34px;padding:0;border:2px solid #ffffff22;border-radius:4px;background:#08111fb0;color:#f2efe4;font-size:16px;line-height:1;cursor:pointer;opacity:.55}
  #mute:hover{opacity:1}
  /* Bouton ARRETER LA MANCHE (design/hud-top-approved.json): pixel-art arcade, coins anguleux */
  #reset{position:fixed;top:12px;right:14px;z-index:5;display:none;box-sizing:border-box;width:190px;height:48px;padding:0;cursor:pointer;
    font:900 13px/1 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;letter-spacing:.06em;text-transform:uppercase;color:#fff3e9;text-shadow:0 2px 0 #54131c;
    background:linear-gradient(#f35454 0 42%,#df3737 42%);border:4px solid #54131c;border-radius:0;
    box-shadow:inset 0 0 0 2px #ff7878,4px 4px 0 #030812cc;image-rendering:pixelated}
  #reset:hover{filter:brightness(1.08)}
  #reset:active{transform:translate(2px,2px);box-shadow:inset 0 0 0 2px #ff7878,2px 2px 0 #030812cc}
  /* Compte a rebours 3-2-1-FIGHT! (style arcade du lobby) */
  #countdown{position:fixed;inset:0;z-index:6;display:none;align-items:center;justify-content:center;pointer-events:none;background:radial-gradient(ellipse at center,#08111f66,#08111f00 70%)}
  #countdown span{font:900 min(34vh,30vw)/1 var(--mono);color:var(--white);letter-spacing:.04em;
    text-shadow:.06em 0 0 var(--red),-.06em 0 0 var(--blue),0 .08em 0 var(--black),0 0 .3em #000a}
  #countdown span.fight{font-size:min(20vh,17vw);color:var(--gold)}
  #countdown span.pop{animation:cdpop .9s ease-out both}
  @keyframes cdpop{0%{transform:scale(1.9);opacity:0}18%{transform:scale(1);opacity:1}80%{transform:scale(1);opacity:1}100%{transform:scale(.85);opacity:0}}
  /* Ecran de fin de manche (design lobby: navy, accents rouge/bleu, gold) */
  #end{position:fixed;inset:0;z-index:8;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#0b1020e6,#08111ff5)}
  #endBox{box-sizing:border-box;width:min(92vw,900px);padding:3vh 3vw;text-align:center;background:linear-gradient(var(--panel2),var(--panel));
    border:3px solid var(--black);border-radius:2px;box-shadow:inset 0 0 0 2px #ffffff14,0 8px 0 #0009,0 0 40px #0009;font-family:var(--mono);animation:endin .5s ease-out both}
  @keyframes endin{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
  #endBox .victory{font:900 clamp(14px,3vh,28px)/1 var(--mono);letter-spacing:.5em;color:var(--gold);text-shadow:0 3px 0 var(--black)}
  #endBox .winner{margin:1.4vh 0 1vh;font:900 clamp(22px,min(7vh,4vw),64px)/1.05 var(--mono);letter-spacing:.04em;text-shadow:0 .08em 0 var(--black),0 0 .4em #0008}
  #endBox .winner.A{color:var(--blueL)}#endBox .winner.B{color:var(--redL)}#endBox .winner.draw{color:var(--white)}
  #endBox .score{display:flex;justify-content:center;align-items:baseline;gap:3vw;font:900 clamp(22px,6vh,64px)/1 var(--mono);text-shadow:0 4px 0 var(--black)}
  #endBox .score small{display:block;font-size:clamp(10px,1.6vh,16px);letter-spacing:.2em;margin-top:.6vh}
  #endBox .score .A{color:var(--blueL)}#endBox .score .B{color:var(--redL)}#endBox .score .vs{color:var(--muted);font-size:.5em}
  #endBox .mvp{display:flex;align-items:center;justify-content:center;gap:2vw;margin:2vh 0 1vh}
  #endBox .mvp .spr{height:clamp(80px,22vh,220px);display:flex;align-items:flex-end}
  #endBox .mvp .spr img,#endBox .mvp .spr canvas{height:100%;image-rendering:pixelated}
  #endBox .mvp .spr canvas{height:70%}
  #endBox .mvp .t{text-align:left}
  #endBox .mvp .lab{font-size:clamp(10px,1.6vh,16px);letter-spacing:.3em;color:var(--gold)}
  #endBox .mvp .nm{font:900 clamp(18px,4.5vh,44px)/1.1 var(--mono);text-transform:uppercase}
  #endBox .mvp .ch{font-size:clamp(11px,1.9vh,19px);letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
  #endBox .foot{display:flex;align-items:center;justify-content:center;gap:2vw;margin-top:2vh;color:var(--muted);font-size:clamp(10px,1.6vh,15px);letter-spacing:.15em}
  #replay{font:900 clamp(16px,3vh,30px)/1 var(--mono);letter-spacing:.1em;padding:1.4vh 2.4vw;cursor:pointer;color:var(--black);
    background:linear-gradient(#ffe07a,var(--gold) 55%,#d99a1c);border:4px solid var(--black);border-radius:2px;box-shadow:inset 0 3px 0 #fff6,0 5px 0 var(--black)}
  .A{color:#60a5fa}.B{color:#f87171}
</style>
</head>
<body>
<canvas id="lobbyBg" width="960" height="540"></canvas>
<div id="lobby">
  <div id="brand"><h1>SHOWER BRAWL</h1><p class="tag"><span>Politics is already a fight. We made it real.</span><span>Pick a leader, and brawl your friends.</span><span>In the end, there will be only one left.</span></p></div>
  <div id="teams">
    <div class="team frame" id="teamA"><h2 class="A">CONSPIRACY CREW</h2><ul></ul></div>
    <div class="team frame" id="teamB"><h2 class="B">CANCEL CLUB</h2><ul></ul></div>
    <p id="waiting" hidden></p>
  </div>
  <div id="join">
    <div id="joinPanel" class="frame"><div class="title">SCAN TO JOIN</div><img id="qr" alt="QR code"></div>
    <button id="start">START MATCH</button>
  </div>
  <div id="roster" class="frame"></div>
</div>
<canvas id="game"></canvas>
<div id="version"></div><div id="fps"></div>
<button id="mute" aria-label="Sound" aria-pressed="false">🔊</button>
<button id="reset">STOP MATCH</button>
<div id="countdown"><span></span></div>
<div id="end"><div id="endBox"></div></div>
<script type="module" src="./host.js"></script>
</body>
</html>
