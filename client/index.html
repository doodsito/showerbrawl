<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shower Brawl</title>
<style>
  html,body{margin:0;height:100%;background:#0b1020;color:#eef;font-family:system-ui,sans-serif;overflow:hidden}
  #lobby{display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px;height:100%;box-sizing:border-box}
  h1{margin:0;font-size:48px;letter-spacing:2px}
  #qr{width:min(40vh,420px);image-rendering:pixelated;background:#fff;border-radius:12px;padding:8px}
  #url{font-size:22px;opacity:.85}
  #teams{display:flex;gap:40px;width:min(900px,95vw)}
  .team{flex:1;border-radius:12px;padding:12px 18px;min-height:120px}
  .team h2{margin:0 0 8px}
  .team ul{margin:0;padding-left:18px;font-size:20px}
  #teamA{background:#1d3b8a55;border:3px solid #3b82f6}
  #teamB{background:#8a1d1d55;border:3px solid #ef4444}
  #start{font-size:32px;padding:14px 60px;border:0;border-radius:12px;background:#facc15;color:#111;font-weight:800;cursor:pointer}
  #game{position:fixed;inset:0;display:none}
  #end{position:fixed;inset:0;display:none;background:#000c;align-items:center;justify-content:center}
  #endBox{background:#141a33;padding:28px 40px;border-radius:16px;min-width:420px;text-align:center}
  #endBox table{margin:12px auto;border-collapse:collapse;font-size:18px}
  #endBox td,#endBox th{padding:4px 14px}
  .A{color:#60a5fa}.B{color:#f87171}
</style>
</head>
<body>
<div id="lobby">
  <h1>SHOWER BRAWL</h1>
  <img id="qr" alt="QR code">
  <div id="url"></div>
  <div id="teams">
    <div class="team" id="teamA"><h2 class="A">Équipe Bleue</h2><ul></ul></div>
    <div class="team" id="teamB"><h2 class="B">Équipe Rouge</h2><ul></ul></div>
  </div>
  <button id="start">START</button>
</div>
<canvas id="game"></canvas>
<div id="end"><div id="endBox"></div></div>
<script type="module" src="./host.js"></script>
</body>
</html>
